name: agentbus tests
on:
  push:
    paths: ["scripts/agentbus.py", "tests/**"]
  pull_request:
    paths: ["scripts/agentbus.py", "tests/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
